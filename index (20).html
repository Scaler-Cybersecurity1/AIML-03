 const c=$(o,"canvas"),x=c.getContext&&c.getContext("2d"),close=()=>{go=false;o.remove()};let go=true;$(o,"#cx").onclick=close;if(!x)return;c.width=innerWidth;c.height=innerHeight;
 const Q=Array.from({length:170},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,s:6+Math.random()*8,v:2+Math.random()*4,a:Math.random()*6,r:Math.random()*.2-.1,c:`hsl(${Math.random()*360},80%,60%)`}));
